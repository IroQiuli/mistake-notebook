<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39C5BB" />
      <stop offset="100%" stop-color="#1E8B83" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- 外围赛博环圈 -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="16 12" />

  <!-- 经典 01 标志文字 -->
  <text x="256" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Impact, Arial Black, sans-serif" font-weight="900" font-size="205" fill="#FFFFFF" letter-spacing="-8" filter="url(#glow)">01</text>

  <!-- MIKU 铭牌 -->
  <rect x="156" y="365" width="200" height="38" rx="19" fill="#0D2826" fill-opacity="0.85" />
  <text x="256" y="391" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace, sans-serif" font-weight="800" font-size="19" fill="#39C5BB" letter-spacing="4">HATSUNE MIKU</text>

  <!-- 右上角初音发带标志粉色方块点缀 -->
  <rect x="375" y="75" width="60" height="60" rx="16" fill="#FF5E97" transform="rotate(15 405 105)" />
  <rect x="382" y="82" width="46" height="46" rx="10" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.8" transform="rotate(15 405 105)" />

  <!-- 考研错题本小徽记 -->
  <circle cx="95" cy="415" r="30" fill="#FF5E97" />
  <text x="95" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF">39</text>
</svg>
