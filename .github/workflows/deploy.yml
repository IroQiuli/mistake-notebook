name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # 仓库的 Pages 需要在 Settings → Pages → Source 选一次「GitHub Actions」
      # （GITHUB_TOKEN 没有创建 Pages 站点的管理员权限，所以不在这里自动开启）
      - uses: actions/configure-pages@v5

      - run: npm run build
        env:
          # 项目页地址是 https://<user>.github.io/<repo>/，资源必须按这个前缀打包
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
