<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#39c5bb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="初音未来 · 错题簿" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="./themes/miku/miku-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=3" />
    <title>初音未来 · 考研伴学错题簿</title>
  </head>
  <body>
    <!-- 初音未来专属启动画面 (PWA / Cold Boot Splash Screen) -->
    <div id="splash-screen" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg, #091a18 0%, #112d2a 50%, #081615 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;transition:opacity 0.4s ease-out, visibility 0.4s ease-out;">
      <div style="position:relative;width:92px;height:92px;display:flex;align-items:center;justify-content:center;border-radius:26px;background:linear-gradient(135deg, #39c5bb 0%, #1f948c 100%);box-shadow:0 0 40px rgba(57,197,187,0.5);">
        <span style="font-size:38px;font-weight:900;letter-spacing:-2px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.25);">01</span>
        <div style="position:absolute;top:-5px;right:-5px;width:22px;height:22px;border-radius:50%;background:#ff5e97;border:3px solid #091a18;box-shadow:0 0 12px #ff5e97;"></div>
      </div>
      <div style="margin-top:22px;font-size:19px;font-weight:700;letter-spacing:0.5px;color:#ffffff;display:flex;align-items:center;gap:6px;">
        <span>初音ミク</span>
        <span style="color:#39c5bb;">·</span>
        <span>考研伴学错题簿</span>
      </div>
      <div style="margin-top:6px;font-size:11px;color:#39c5bb;letter-spacing:0.5px;opacity:0.9;">Hatsune Miku Spaced Repetition Notebook</div>
      <div style="margin-top:28px;display:flex;gap:4px;align-items:flex-end;height:22px;">
        <span style="width:3.5px;height:10px;background:#39c5bb;border-radius:2px;animation:mikuWave 1s infinite ease-in-out;"></span>
        <span style="width:3.5px;height:18px;background:#39c5bb;border-radius:2px;animation:mikuWave 1s infinite 0.15s ease-in-out;"></span>
        <span style="width:3.5px;height:22px;background:#ff5e97;border-radius:2px;animation:mikuWave 1s infinite 0.3s ease-in-out;"></span>
        <span style="width:3.5px;height:16px;background:#39c5bb;border-radius:2px;animation:mikuWave 1s infinite 0.45s ease-in-out;"></span>
        <span style="width:3.5px;height:8px;background:#39c5bb;border-radius:2px;animation:mikuWave 1s infinite 0.6s ease-in-out;"></span>
      </div>
      <div style="margin-top:12px;font-size:11px;color:rgba(255,255,255,0.45);">39! 正在准备今日复习计划...</div>
      <style>
        @keyframes mikuWave {
          0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
          50% { transform: scaleY(1); opacity: 1; }
        }
      </style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
